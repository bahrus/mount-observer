<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script nomodule id=Person be-scoped>
    ({})
</script>
    <table>
        <thead><th>Name</th><th>SSN Number</th></thead>
        <tbody>
            <tr itemscope=Person id=temp itemref=childRow>
                <td itemprop=name>Burt</td>
                <td itemprop=ssn>123-45-6789</td>
            </tr>
            <tr id=childRow colspan=2>
                <td>ChildRow</td>
            </tr>
            <template data-ld='{"name": "Sally", "ssn": "987-65-4321"}' src=#temp></template>
            <template data-ld='{"name": "Anne", "ssn": "135-79-2468"}' src=#temp></template>
        </tbody>
    </table>
    <div id=target></div>
    <script type=module>
        import {MountObserver} from '/MountObserver.js';
        import {regIsh} from '/refid/regIsh.js';
        regIsh(document.querySelector('table'), 'Person', class {
            
            constructor() {
                console.log('iah');
            }
        });

        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });
        mo.observe(document.body);
        function runTest(){
            const tbl = document.querySelector('table');
            const cnt = tbl.querySelectorAll('*').length;
            //console.log('cnt', cnt);
            if(cnt === 16){
                target.setAttribute('mark', 'good');
            } 
        }
        setTimeout(() => {
            runTest();
        }, 500);
    </script>
</body>
</html>
