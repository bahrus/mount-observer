<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check</title>
</head>
<body>
    <div id=div>
        <span id=span itemscope=myVM></span>
    </div>
    <div id=target></div>
    <script type=module>
        import {MountObserver} from '/MountObserver.js';
        import {regIsh} from '/refid/regIsh.js';
        span.addEventListener('ish', e => {
            if(e.target.ish.test === 'hello'){
                target.setAttribute('mark', 'good');
            }
        });
        regIsh(div, 'myVM', class {
            test = 'hello';
        });
        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });

        mo.observe(div);
        
    </script>
</body>
</html>
