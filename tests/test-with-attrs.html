<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WithAttrs Integration Tests</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="test-container"></div>

    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        import { BaseRegistry } from 'assign-gingerly/assignGingerly.js';

        // Polyfill customElementRegistry for browsers that don't support it yet
        if (!Element.prototype.hasOwnProperty('customElementRegistry')) {
            Object.defineProperty(Element.prototype, 'customElementRegistry', {
                get: function() {
                    if (!this._customElementRegistry) {
                        this._customElementRegistry = {
                            enhancementRegistry: new BaseRegistry()
                        };
                    }
                    return this._customElementRegistry;
                },
                enumerable: true,
                configurable: true
            });
        }

        window.testResults = {
            mountedElements: []
        };

        console.log('Test setup complete');
    </script>
</body>
</html>
