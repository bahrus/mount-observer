<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colon Delimiter Test</title>
</head>
<body>
    <h1>Colon Delimiter Test</h1>

    <!-- Test elements with colon delimiters -->
    <input id="test1" enh_my-greetings:hello="test1">
    <input id="test2" enh_my-greetings:hello:how-are-you="test2">
    <input id="test3" enh_my-greetings--goodbye="test3">
    <input id="test4" enh_my-greetings--goodbye---last-words="test4">
    
    <div id="results"></div>

    <script type="module">
        import { MountObserver } from '../MountObserver.js';

        const results = [];
        const mountedElements = [];

        const observer = new MountObserver({
            whereElementMatches: 'input',
            whereAttr: {
                hasBuiltInRootIn: ['', 'data', 'enh', 'data-enh'],
                hasCERootIn: ['', 'data', 'enh', 'data-enh'],
                hasBase: '[_]my-greetings',
                hasBranchIn: [
                    '',
                    {
                        '[:]hello': ['', '[:]how-are-you']
                    },
                    {
                        '[--]goodbye': ['', '[---]last-words']
                    }
                ]
            },
            do: (el) => {
                mountedElements.push(el.id);
                results.push(`✅ Mounted: ${el.id} with attribute ${el.attributes[0].name}`);
                
                // Check if all elements are mounted
                const expected = ['test1', 'test2', 'test3', 'test4'];
                if (expected.every(id => mountedElements.includes(id))) {
                    checkResults();
                }
            }
        });

        function checkResults() {
            // Only run once
            if (window.testResult !== undefined) return;
            
            const resultsDiv = document.getElementById('results');
            
            // Check expected results
            const expected = ['test1', 'test2', 'test3', 'test4'];
            const allMounted = expected.every(id => mountedElements.includes(id));
            
            if (allMounted) {
                results.unshift('✅ All elements with colon delimiters matched correctly!');
            } else {
                results.unshift(`❌ Missing elements: ${expected.filter(id => !mountedElements.includes(id)).join(', ')}`);
            }
            
            resultsDiv.innerHTML = `<pre>${results.join('\n')}</pre>`;
            
            // Set test result for Playwright
            window.testResult = allMounted;
        }

        observer.observe(document.body);

        // Fallback timeout in case not all elements mount
        setTimeout(() => {
            checkResults();
        }, 1000);
    </script>
</body>
</html>
