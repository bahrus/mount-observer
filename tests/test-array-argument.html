<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Argument Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>Array Argument Test</h1>
    
    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        import { BaseRegistry } from 'assign-gingerly/assignGingerly.js';
        
        // Polyfill for browsers without customElementRegistry
        if (!Element.prototype.hasOwnProperty('customElementRegistry')) {
            Object.defineProperty(Element.prototype, 'customElementRegistry', {
                get() {
                    if (!this._customElementRegistry) {
                        this._customElementRegistry = {
                            enhancementRegistry: new BaseRegistry()
                        };
                    }
                    return this._customElementRegistry;
                }
            });
        }
        
        const results = {
            test1: {
                enhancement1Spawned: false,
                enhancement2Spawned: false
            },
            test2: {
                withAttrsMounted: false
            }
        };
        
        console.log('Starting Array Argument Tests...');
        
        // Test 1: Pass array of EnhancementConfigs directly
        console.log('Test 1: Pass array of EnhancementConfigs directly');
        
        class Enhancement1 {
            constructor(element, ctx, initVals) {
                this.element = element;
                this.name = 'enhancement1';
            }
        }
        
        class Enhancement2 {
            constructor(element, ctx, initVals) {
                this.element = element;
                this.name = 'enhancement2';
            }
        }
        
        const observer1 = new MountObserver([
            {
                spawn: Enhancement1,
                symlinks: {},
                enhKey: 'enh1'
            },
            {
                spawn: Enhancement2,
                symlinks: {},
                enhKey: 'enh2'
            }
        ]);
        
        await observer1.observe(document.body);
        
        const elem1 = document.createElement('div');
        elem1.id = 'test1';
        
        // Add polyfill inline for Firefox compatibility
        if (!elem1.customElementRegistry) {
            Object.defineProperty(elem1, 'customElementRegistry', {
                value: {
                    enhancementRegistry: new BaseRegistry()
                },
                configurable: true
            });
        }
        
        document.body.appendChild(elem1);
        await new Promise(resolve => setTimeout(resolve, 100));
        
        results.test1.enhancement1Spawned = elem1.enh?.enh1 !== undefined;
        results.test1.enhancement2Spawned = elem1.enh?.enh2 !== undefined;
        
        console.log('Test 1 complete:', results.test1);
        
        // Test 2: Array with withAttrs
        console.log('Test 2: Array with withAttrs');
        
        let mounted = false;
        const observer2 = new MountObserver([
            {
                withAttrs: {
                    base: 'data-',
                    theme: '${base}theme'
                }
            }
        ]);
        
        observer2.addEventListener('mount', () => {
            mounted = true;
        });
        
        await observer2.observe(document.body);
        
        const elem2 = document.createElement('button');
        elem2.id = 'test2';
        elem2.setAttribute('data-theme', 'dark');
        document.body.appendChild(elem2);
        
        await new Promise(resolve => setTimeout(resolve, 100));
        
        results.test2.withAttrsMounted = mounted;
        
        console.log('Test 2 complete:', results.test2);
        
        // Display results
        console.log('--- Test Results ---');
        console.log('Test 1 (Array with spawn):', results.test1);
        console.log('Test 2 (Array with withAttrs):', results.test2);
        
        window.testResults = results;
        window.testComplete = true;
    </script>
</body>
</html>
