<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Scope</title>
</head>
<body>
    <div id=div>
        <span id=span itemscope=myVM itemref="test"></span>
        <span id=test>hello</span>
    </div>
    <div id=target></div>
    <script type=module>
        import {MountObserver} from '/MountObserver.js';
        import {regIsh} from '/refId/regIsh.js';
        regIsh(div, 'myVM', class {
            test = 'hello';
            #mountedEl;
            #inScopeEl;
            '<mount>'(self, el){
                this.#mountedEl = el;
                this.#checkIfBoth();
                console.log({el});
            }

            '<inScope>'(self, el){
                this.#inScopeEl = el;
                this.#checkIfBoth();
                console.log({el});
            }
            #checkIfBoth(){
                if(this.#mountedEl && this.#inScopeEl){
                    target.setAttribute('mark', 'good');
                }
            }
        });
        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });
        mo.observe(div);
    </script>
</body>
</html>
