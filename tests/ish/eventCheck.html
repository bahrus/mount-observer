<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check</title>
</head>
<body>
    <div id=div>
        <span id=span itemscope=my-element></span>
    </div>
    <div id=target></div>
    <script type=module>
        import {MountObserver} from '/MountObserver.js';
        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });
        span.addEventListener('ish-resolved', e => {
            if(e.target.ish.test === 'hello'){
                target.setAttribute('mark', 'good');
            }
        });
        mo.observe(div);
        customElements.define('my-element', class extends HTMLElement {
            test = 'hello';
            constructor() {
                super();
                this.attachShadow({mode: 'open'});
                this.shadowRoot.innerHTML = `<span>My Element</span>`;
            }
        });
    </script>
</body>
</html>
