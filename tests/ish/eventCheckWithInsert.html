<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check With Insert</title>
</head>
<body>
    <div id=div></div>
    <div id=target></div>
    <script type=module>
        import {MountObserver} from '/MountObserver.js';
        import {regIsh} from '/refId/regIsh.js';
                regIsh(div, 'myVM', class {
            test = 'hello';
        });
        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });

        mo.observe(div);

        setTimeout(() => {
            const span = document.createElement('span');
            span.addEventListener('ish', e => {
                if(e.target.ish.test === 'hello'){
                    target.setAttribute('mark', 'good');
                }
            });
            span.id = 'span';
            span.setAttribute('itemscope', 'myVM');
            div.appendChild(span);
        }, 500);
    </script>
</body>
</html>
