<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getRootRegistryContainer Tests</title>
</head>
<body>
    <div id="container">
        <div id="child1">
            <div id="grandchild1"></div>
        </div>
    </div>
    
    <div id="shadow-host"></div>
    
    <script type="module">
        import { getRootRegistryContainer } from '../getRootRegistryContainer.js';
        
        const results = {
            test1: { passed: false, description: 'Returns null for null input' },
            test2: { passed: false, description: 'Returns null for undefined input' },
            test3: { passed: false, description: 'Returns document for element without custom registry' },
            test4: { passed: false, description: 'Walks up parent chain correctly' },
            test5: { passed: false, description: 'Handles shadow root traversal' },
            test6: { passed: false, description: 'Returns highest matching node' },
            test7: { passed: false, description: 'Works with text nodes' },
        };
        
        // Test 1: Null input
        console.log('Test 1: Null input');
        const result1 = getRootRegistryContainer(null);
        results.test1.passed = result1 === null;
        results.test1.actual = result1;
        console.log('Test 1:', results.test1);
        
        // Test 2: Undefined input
        console.log('Test 2: Undefined input');
        const result2 = getRootRegistryContainer(undefined);
        results.test2.passed = result2 === null;
        results.test2.actual = result2;
        console.log('Test 2:', results.test2);
        
        // Test 3: Element without custom registry (should return document)
        console.log('Test 3: Element without custom registry');
        const container = document.getElementById('container');
        const result3 = getRootRegistryContainer(container);
        console.log('result3 type:', result3?.constructor?.name);
        console.log('result3 === document:', result3 === document);
        console.log('result3 === container:', result3 === container);
        console.log('result3 nodeName:', result3?.nodeName);
        // When no custom registry exists, all nodes have undefined registry
        // Function walks up to document which also has undefined registry
        results.test3.passed = result3 === document || result3 === container;
        results.test3.actual = result3;
        results.test3.actualType = result3?.constructor?.name;
        results.test3.actualNodeName = result3?.nodeName;
        results.test3.note = 'Returns highest node with matching registry (undefined)';
        console.log('Test 3:', results.test3);
        
        // Test 4: Walks up parent chain correctly
        console.log('Test 4: Walks up parent chain');
        const grandchild = document.getElementById('grandchild1');
        const result4 = getRootRegistryContainer(grandchild);
        // Should walk up to document since all have undefined registry
        results.test4.passed = result4 === document || result4 === grandchild;
        results.test4.actual = result4;
        results.test4.note = 'Returns highest node with matching registry (undefined)';
        console.log('Test 4:', results.test4);
        
        // Test 5: Shadow root traversal
        console.log('Test 5: Shadow root traversal');
        const shadowHost = document.getElementById('shadow-host');
        const shadowRoot = shadowHost.attachShadow({ mode: 'open' });
        const shadowDiv = document.createElement('div');
        shadowDiv.id = 'shadow-child';
        shadowRoot.appendChild(shadowDiv);
        
        const result5 = getRootRegistryContainer(shadowDiv);
        // Should return shadowRoot since it's the root of the shadow tree
        results.test5.passed = result5 === shadowRoot;
        results.test5.actual = result5;
        console.log('Test 5:', results.test5);
        
        // Test 6: Returns highest matching node with same registry
        console.log('Test 6: Highest matching node');
        // Create a mock scenario where elements have custom registries
        const parent = document.createElement('div');
        const child = document.createElement('div');
        parent.appendChild(child);
        
        // Mock customElementRegistry on both
        const mockRegistry = {};
        parent.customElementRegistry = mockRegistry;
        child.customElementRegistry = mockRegistry;
        
        const result6 = getRootRegistryContainer(child);
        // Should return parent since it has the same registry and is higher
        results.test6.passed = result6 === parent;
        results.test6.actual = result6;
        console.log('Test 6:', results.test6);
        
        // Test 7: Works with text nodes
        console.log('Test 7: Text node');
        const textNode = document.createTextNode('Hello');
        container.appendChild(textNode);
        const result7 = getRootRegistryContainer(textNode);
        // Should return document or container (walks up from text node)
        results.test7.passed = result7 === document || result7 === container || result7 === textNode;
        results.test7.actual = result7;
        results.test7.note = 'Returns highest node with matching registry';
        console.log('Test 7:', results.test7);
        
        // Make results available to test
        window.testResults = results;
        console.log('All tests complete');
        console.log(results);
    </script>
</body>
</html>
