<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn On Mount Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="test-container">
        <div class="spawn-target" data-value="42"></div>
        <div class="spawn-target" data-value="100"></div>
        <div class="spawn-with-attrs" data-test-value="999"></div>
    </div>

    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        import 'assign-gingerly/object-extension.js';
        import { BaseRegistry } from 'assign-gingerly/assignGingerly.js';

        // Polyfill customElementRegistry for browsers that don't support it yet
        if (!Element.prototype.hasOwnProperty('customElementRegistry')) {
            Object.defineProperty(Element.prototype, 'customElementRegistry', {
                get: function() {
                    if (!this._customElementRegistry) {
                        this._customElementRegistry = {
                            enhancementRegistry: new BaseRegistry()
                        };
                    }
                    return this._customElementRegistry;
                },
                enumerable: true,
                configurable: true
            });
        }

        // Define an enhancement class
        class TestEnhancement {
            element;
            ctx;
            value = null;
            mountContext = null;

            constructor(oElement, ctx, initVals) {
                this.element = oElement;
                this.ctx = ctx;
                this.mountContext = ctx?.mountCtx;
                
                if (initVals) {
                    Object.assign(this, initVals);
                }
                
                // Mark element as enhanced
                oElement.setAttribute('data-enhanced', 'true');
            }

            getValue() {
                return this.value;
            }
        }

        // Make TestEnhancement available globally for tests
        window.TestEnhancement = TestEnhancement;

        // Test 1: Basic spawn
        const config1 = {
            matching: '.spawn-target',
            enhancementConfig: {
                spawn: TestEnhancement,
                enhKey: 'testEnh'
            }
        };

        const observer1 = new MountObserver(config1);
        await observer1.observe(document.body);

        // Test 2: Spawn with withAttrs
        const config2 = {
            matching: '.spawn-with-attrs',
            enhancementConfig: {
                spawn: TestEnhancement,
                enhKey: 'testEnh2',  // Use different enhKey to avoid conflicts
                withAttrs: {
                    base: 'data-test',  // Must contain dash
                    value: '${base}-value'
                }
            },
            do: (element) => {
                console.log('Observer2 do callback called for:', element);
                element.setAttribute('data-observer2-called', 'true');
            }
        };

        const observer2 = new MountObserver(config2);
        await observer2.observe(document.body);

        // Test 3: Spawn with canSpawn guard
        class GuardedEnhancement {
            element;
            
            constructor(oElement, ctx, initVals) {
                this.element = oElement;
                oElement.setAttribute('data-guarded', 'true');
            }

            static canSpawn(obj, ctx) {
                // Only spawn if element has data-allow attribute
                return obj.hasAttribute('data-allow');
            }
        }

        window.GuardedEnhancement = GuardedEnhancement;

        const config3 = {
            matching: '.spawn-guarded',
            enhancementConfig: {
                spawn: GuardedEnhancement,
                enhKey: 'guardedEnh'
            }
        };

        const observer3 = new MountObserver(config3);
        await observer3.observe(document.body);

        // Make observers available for tests
        window.observer1 = observer1;
        window.observer2 = observer2;
        window.observer3 = observer3;
        window.MountObserver = MountObserver;

        // Signal that setup is complete
        window.setupComplete = true;
    </script>
</body>
</html>
