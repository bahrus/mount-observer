<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Reference Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>Simple Reference Test</h1>
    
    <button id="existing-btn">Existing Button</button>
    
    <div id="log"></div>
    
    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        
        const log = document.getElementById('log');
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }
        
        window.results = {
            inlineCalled: false,
            referencedCalled: false
        };
        
        addLog('Creating observer...');
        
        const observer = new MountObserver({
            whereElementMatches: 'button',
            import: '/tests/test-actions.js',
            reference: 0,
            do: (element) => {
                addLog(`Inline do called for ${element.id}`);
                window.results.inlineCalled = true;
            }
        });
        
        observer.addEventListener('load', (e) => {
            addLog(`Load event: ${e.modules.length} modules loaded`);
            addLog(`Module 0: ${JSON.stringify(Object.keys(e.modules[0]))}`);
            addLog(`Module 0 has 'do': ${typeof e.modules[0].do}`);
        });
        
        observer.addEventListener('mount', (e) => {
            addLog(`Mount event: ${e.mountedElement.id}`);
        });
        
        addLog('Observing document...');
        await observer.observe(document);
        addLog('Observer active');
        
        addLog('Adding button...');
        const btn = document.createElement('button');
        btn.id = 'test-btn';
        btn.textContent = 'Test';
        document.body.appendChild(btn);
        addLog('Button added');
        
        setTimeout(() => {
            addLog('--- Results ---');
            addLog(`Inline called: ${window.results.inlineCalled}`);
            addLog(`Referenced called: ${window.results.referencedCalled}`);
            window.testComplete = true;
        }, 2000);
    </script>
</body>
</html>
