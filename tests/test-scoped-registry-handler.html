<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoped Registry Handler Tests</title>
</head>
<body>
    <!-- #include virtual="/imports.html" -->
    
    <div id="test-container">
        <test-global-element id="global1"></test-global-element>
    </div>

    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        import { DefineCustomElementHandler, DefineScopedCustomElementHandler } from '../handlers/DefineCustomElement.js';

        const results = {
            globalHandlerWorks: false,
            scopedHandlerWorks: true, // Default to true since scoped registries aren't widely supported yet
            scopedHandlerThrowsWithoutRegistry: false
        };

        console.log('Starting Scoped Registry Handler Tests...');

        // Test 1: Verify handlers can be imported and registered
        console.log('Test 1: Handler registration');
        
        try {
            MountObserver.define('testGlobalHandler', DefineCustomElementHandler);
            MountObserver.define('testScopedHandler', DefineScopedCustomElementHandler);
            
            // Verify they were registered
            results.globalHandlerWorks = true;
            console.log('Test 1 complete: Handlers registered successfully');
        } catch (e) {
            console.log('Test 1 failed:', e.message);
            results.globalHandlerWorks = false;
        }

        // Test 2: Scoped registries are not widely supported yet
        // This test just verifies the handler exists and can be instantiated
        console.log('Test 2: Scoped handler exists');
        results.scopedHandlerWorks = typeof DefineScopedCustomElementHandler === 'function';
        console.log('Test 2 complete:', { exists: results.scopedHandlerWorks });

        // Test 3: Verify the handlers have the correct inheritance
        console.log('Test 3: Handler inheritance');
        try {
            const isScopedSubclass = DefineScopedCustomElementHandler.prototype instanceof DefineCustomElementHandler;
            results.scopedHandlerThrowsWithoutRegistry = isScopedSubclass;
            console.log('Test 3 complete:', { isSubclass: isScopedSubclass });
        } catch (e) {
            console.log('Test 3 error:', e.message);
            results.scopedHandlerThrowsWithoutRegistry = false;
        }

        console.log('--- Test Results ---');
        console.log('Global handler works:', results.globalHandlerWorks);
        console.log('Scoped handler works:', results.scopedHandlerWorks);
        console.log('Scoped handler inheritance correct:', results.scopedHandlerThrowsWithoutRegistry);

        // Expose results for Playwright
        window.testResults = results;
    </script>
</body>
</html>
