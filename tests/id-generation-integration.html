<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID Generation Integration Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="log"></div>
    
    <fieldset disabled>
        <label>
            LHS: <input data-id="{{lhs}}">
        </label>
        
        <label for="rhs">
            RHS: <input data-id="{{rhs}}">
        </label>
        
        <template -id defer-🎚️ 🎚️='on if isEqual, based on #{{lhs}} and #{{rhs}}.'>
            <div>LHS === RHS</div>
        </template>
    </fieldset>
    
    <div id="target"></div>
    
    <script type="module">
        import { MountObserver } from '../index.js';
        
        const log = document.getElementById('log');
        function addLog(msg) {
            console.log(msg);
            log.innerHTML += msg + '<br>';
        }
        
        addLog('Testing MountObserver with builtIns.processIdGeneration...');
        
        (async () => {
            try {
                const observer = new MountObserver({
                    do: 'builtIns.processIdGeneration'
                });
                
                await observer.observe(document.body);
                addLog('MountObserver created and observing');
                
                // Wait for processing
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Check if IDs were generated
                const lhsInput = document.querySelector('[data-id="lhs"]');
                const rhsInput = document.querySelector('[data-id="rhs"]');
                const template = document.querySelector('template');
                const fieldset = document.querySelector('fieldset');
                
                if (lhsInput && lhsInput.id) {
                    addLog(`✓ LHS input has ID: ${lhsInput.id}`);
                } else {
                    addLog('✗ LHS input missing ID');
                }
                
                if (rhsInput && rhsInput.id) {
                    addLog(`✓ RHS input has ID: ${rhsInput.id}`);
                } else {
                    addLog('✗ RHS input missing ID');
                }
                
                if (template) {
                    const attr = template.getAttribute('🎚️');
                    if (attr && attr.includes('#gid-')) {
                        addLog(`✓ Template references replaced: ${attr}`);
                    } else {
                        addLog(`✗ Template references not replaced: ${attr}`);
                    }
                    
                    if (!template.hasAttribute('-id')) {
                        addLog('✓ -id attribute removed from template');
                    } else {
                        addLog('✗ -id attribute still present');
                    }
                    
                    if (!template.hasAttribute('defer-🎚️')) {
                        addLog('✓ defer-🎚️ attribute removed');
                    } else {
                        addLog('✗ defer-🎚️ attribute still present');
                    }
                }
                
                if (fieldset && !fieldset.hasAttribute('disabled')) {
                    addLog('✓ Fieldset disabled attribute removed');
                } else {
                    addLog('✗ Fieldset still disabled');
                }
                
                // Mark test as complete
                document.getElementById('target').setAttribute('mark', 'good');
                addLog('Test complete!');
                
            } catch (e) {
                addLog('ERROR: ' + e.message);
                addLog('Stack: ' + e.stack);
            }
        })();
    </script>
</body>
</html>
