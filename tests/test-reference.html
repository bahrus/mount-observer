<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Property Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>Reference Property Test</h1>
    
    <div id="results"></div>
    
    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        
        window.testResults = [];
        
        function addResult(message) {
            console.log(message);
            window.testResults.push(message);
            const div = document.getElementById('results');
            const p = document.createElement('p');
            p.textContent = message;
            div.appendChild(p);
        }
        
        async function runTests() {
            try {
                addResult('Starting tests...');
                
                // Test 1: Single reference with inline do
                addResult('Creating observer1...');
                const observer1 = new MountObserver({
                    whereElementMatches: '.test-elem-1',
                    import: '/tests/test-actions.js',
                    reference: 0,
                    loadingEagerness: 'eager',
                    do: (element) => {
                        addResult(`✓ Inline do called for ${element.id}`);
                        window.inlineDoCalled = true;
                    }
                });
                
                addResult('Observing with observer1...');
                await observer1.observe(document);
                addResult('Observer1 ready');
                
                // Add element after observer is ready
                addResult('Adding elem1...');
                const elem1 = document.createElement('div');
                elem1.className = 'test-elem-1';
                elem1.id = 'test1';
                document.body.appendChild(elem1);
                addResult('elem1 added');
                
                // Wait for processing
                await new Promise(resolve => setTimeout(resolve, 500));
                addResult('After wait 1');
                
                // Test 2: Multiple references
                addResult('Creating observer2...');
                const observer2 = new MountObserver({
                    whereElementMatches: '.test-elem-2',
                    import: [
                        '/tests/test-actions.js',
                        '/tests/test-actions2.js'
                    ],
                    reference: [0, 1],
                    loadingEagerness: 'eager'
                });
                
                addResult('Observing with observer2...');
                await observer2.observe(document);
                addResult('Observer2 ready');
                
                // Add element after observer is ready
                addResult('Adding elem2...');
                const elem2 = document.createElement('div');
                elem2.className = 'test-elem-2';
                elem2.id = 'test2';
                document.body.appendChild(elem2);
                addResult('elem2 added');
                
                // Wait for processing
                await new Promise(resolve => setTimeout(resolve, 500));
                addResult('After wait 2');
                
                // Check results
                addResult('--- Test Results ---');
                
                const test1Passed = window.inlineDoCalled && window.referencedDoCalled;
                const test2Passed = window.secondReferencedDoCalled;
                
                addResult(`inlineDoCalled: ${window.inlineDoCalled}`);
                addResult(`referencedDoCalled: ${window.referencedDoCalled}`);
                addResult(`secondReferencedDoCalled: ${window.secondReferencedDoCalled}`);
                
                if (test1Passed) {
                    addResult('✅ Test 1 passed: Inline and referenced do both called');
                } else {
                    addResult('❌ Test 1 failed');
                }
                
                if (test2Passed) {
                    addResult('✅ Test 2 passed: Multiple references called');
                } else {
                    addResult('❌ Test 2 failed');
                }
                
                window.testPassed = test1Passed && test2Passed;
                addResult(`testPassed: ${window.testPassed}`);
            } catch (error) {
                addResult(`ERROR: ${error.message}`);
                addResult(`Stack: ${error.stack}`);
                console.error(error);
                window.testPassed = false;
            }
        }
        
        runTests();
    </script>
</body>
</html>
