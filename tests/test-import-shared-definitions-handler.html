<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ImportSharedDefinitions Handler</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>Test ImportSharedDefinitions Handler</h1>
    
    <div id="host"></div>
    
    <script type="module">
        console.log('Test starting...');
        
        try {
            const { MountObserver } = await import('../index.js');
            const { SharedDefinitionRegistry } = await import('../SharedDefinitionRegistry.js');
            
            // Check if browser supports scoped registries
            const host = document.getElementById('host');
            const shadow = host.attachShadow({ mode: 'open' });
            
            if (!shadow.customElementRegistry) {
                console.log('⚠ Browser does not support scoped registries, skipping tests');
                window.testComplete = true;
                return;
            }
            
            // Define test custom elements
            class SharedElement1 extends HTMLElement {
                constructor() {
                    super();
                    this.textContent = 'Shared Element 1';
                }
            }
            
            class SharedElement2 extends HTMLElement {
                constructor() {
                    super();
                    this.textContent = 'Shared Element 2';
                }
            }
            
            // Publish to shared registry
            const sharedRegistry = SharedDefinitionRegistry.getInstance();
            sharedRegistry.publish('shared-element-1', SharedElement1);
            sharedRegistry.publish('shared-element-2', SharedElement2);
            console.log('✓ Published definitions to shared registry');
            
            // Test 1: Handler matches elements with different registries
            const observer = new MountObserver({
                do: 'builtIns.importSharedDefinitions'
            });
            await observer.observe(document.body);
            console.log('✓ Observer created');
            
            // Test 2: Handler registers all shared definitions
            const elem = document.createElement('div');
            shadow.appendChild(elem);
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const scopedRegistry = shadow.customElementRegistry;
            if (!scopedRegistry.get('shared-element-1')) {
                throw new Error('shared-element-1 not registered in scoped registry');
            }
            if (!scopedRegistry.get('shared-element-2')) {
                throw new Error('shared-element-2 not registered in scoped registry');
            }
            console.log('✓ All shared definitions registered');
            
            // Test 3: Idempotent registration (adding another element shouldn't re-register)
            const elem2 = document.createElement('div');
            shadow.appendChild(elem2);
            await new Promise(resolve => setTimeout(resolve, 50));
            // Should not throw
            console.log('✓ Idempotent registration works');
            
            // Test 4: New shadow root gets definitions
            const host2 = document.createElement('div');
            document.body.appendChild(host2);
            const shadow2 = host2.attachShadow({ mode: 'open' });
            const elem3 = document.createElement('div');
            shadow2.appendChild(elem3);
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const scopedRegistry2 = shadow2.customElementRegistry;
            if (!scopedRegistry2.get('shared-element-1')) {
                throw new Error('shared-element-1 not registered in second scoped registry');
            }
            console.log('✓ New shadow root receives definitions');
            
            // Test 5: Definition already exists (should not throw)
            class PreExistingElement extends HTMLElement {}
            scopedRegistry2.define('pre-existing', PreExistingElement);
            sharedRegistry.publish('pre-existing', PreExistingElement);
            
            const host3 = document.createElement('div');
            document.body.appendChild(host3);
            const shadow3 = host3.attachShadow({ mode: 'open' });
            const elem4 = document.createElement('div');
            shadow3.appendChild(elem4);
            await new Promise(resolve => setTimeout(resolve, 100));
            // Should not throw
            console.log('✓ Handles existing definitions gracefully');
            
            console.log('All tests passed!');
            window.testComplete = true;
        } catch (error) {
            console.error('Test error:', error);
            window.testError = error.message;
            window.testComplete = true;
        }
    </script>
</body>
</html>
