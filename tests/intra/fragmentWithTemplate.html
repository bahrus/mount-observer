<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragment No Template</title>
</head>
<body>
    <div id=div>
        <template id=my-template>
            <div>hello</div>
            <span></span>
            <div>world</div>
        </template>

        <template src=#my-template>
            <span> there,</span>
        </template>
    </div>
    
    <script type=module>
        import {MountObserver} from '/MountObserver.js';
    
        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });

        mo.observe(div);
        
    </script>
</body>
</html>
