<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check</title>
</head>
<body>
    <div id=div>
        <!--my-template-->
        <div>hello</div>
        <div>world</div>
        <!--/my-template-->


        <template src=!my-template></template>
    </div>

        import {MountObserver} from '/MountObserver.js';
    
        const mo = new MountObserver({
            on: 'h3',
            do:{
                mount: (el, ctx) => {
                }
            }
        });

        mo.observe(div);
        
    </script>
