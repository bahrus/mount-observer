<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referenced whereInstanceOf Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>Referenced whereInstanceOf Test</h1>
    
    <div id="results"></div>
    
    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        
        window.testResults = [];
        
        function addResult(message) {
            console.log(message);
            window.testResults.push(message);
            const div = document.getElementById('results');
            const p = document.createElement('p');
            p.textContent = message;
            div.appendChild(p);
        }
        
        async function runTests() {
            try {
                addResult('Starting tests...');
                
                // Test 1: Referenced whereInstanceOf with buttons and inputs
                addResult('Test 1: Referenced whereInstanceOf filters correctly');
                const observer1 = new MountObserver({
                    withMatching: '.test1',
                    import: '/tests/test-instanceof-module.js',
                    reference: 0,
                    loadingEagerness: 'eager'
                });
                
                await observer1.observe(document);
                
                // Add elements - only button and input should mount
                const btn1 = document.createElement('button');
                btn1.className = 'test1';
                btn1.id = 'btn1';
                document.body.appendChild(btn1);
                
                const input1 = document.createElement('input');
                input1.className = 'test1';
                input1.id = 'input1';
                document.body.appendChild(input1);
                
                const div1 = document.createElement('div');
                div1.className = 'test1';
                div1.id = 'div1';
                document.body.appendChild(div1);
                
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // Test 2: Combining inline and referenced whereInstanceOf (AND logic)
                addResult('Test 2: Inline AND referenced whereInstanceOf');
                const observer2 = new MountObserver({
                    withMatching: '.test2',
                    whereInstanceOf: HTMLElement, // All elements match this
                    import: '/tests/test-instanceof-module2.js',
                    reference: 0,
                    loadingEagerness: 'eager'
                });
                
                await observer2.observe(document);
                
                // Add elements - only div should mount (matches both inline HTMLElement and referenced HTMLDivElement)
                const div2 = document.createElement('div');
                div2.className = 'test2';
                div2.id = 'div2';
                document.body.appendChild(div2);
                
                const span2 = document.createElement('span');
                span2.className = 'test2';
                span2.id = 'span2';
                document.body.appendChild(span2);
                
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // Test 3: Lazy loading with referenced whereInstanceOf
                addResult('Test 3: Lazy loading with referenced whereInstanceOf');
                const observer3 = new MountObserver({
                    withMatching: '.test3',
                    import: '/tests/test-instanceof-module.js',
                    reference: 0
                    // No loadingEagerness - lazy loading
                });
                
                await observer3.observe(document);
                
                // Add button - should mount after imports load
                const btn3 = document.createElement('button');
                btn3.className = 'test3';
                btn3.id = 'btn3';
                document.body.appendChild(btn3);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Check results
                addResult('--- Test Results ---');
                
                const test1Pass = window.moduleDoCalledFor && 
                                  window.moduleDoCalledFor.includes('btn1') &&
                                  window.moduleDoCalledFor.includes('input1') &&
                                  !window.moduleDoCalledFor.includes('div1');
                
                const test2Pass = window.module2DoCalledFor &&
                                  window.module2DoCalledFor.includes('div2') &&
                                  !window.module2DoCalledFor.includes('span2');
                
                const test3Pass = window.moduleDoCalledFor &&
                                  window.moduleDoCalledFor.includes('btn3');
                
                addResult(`Test 1: ${test1Pass ? '✅ PASS' : '❌ FAIL'} - Referenced whereInstanceOf filtered correctly`);
                addResult(`  btn1 mounted: ${window.moduleDoCalledFor?.includes('btn1')}`);
                addResult(`  input1 mounted: ${window.moduleDoCalledFor?.includes('input1')}`);
                addResult(`  div1 mounted: ${window.moduleDoCalledFor?.includes('div1')} (should be false)`);
                
                addResult(`Test 2: ${test2Pass ? '✅ PASS' : '❌ FAIL'} - Inline AND referenced whereInstanceOf`);
                addResult(`  div2 mounted: ${window.module2DoCalledFor?.includes('div2')}`);
                addResult(`  span2 mounted: ${window.module2DoCalledFor?.includes('span2')} (should be false)`);
                
                addResult(`Test 3: ${test3Pass ? '✅ PASS' : '❌ FAIL'} - Lazy loading with referenced whereInstanceOf`);
                addResult(`  btn3 mounted: ${window.moduleDoCalledFor?.includes('btn3')}`);
                
                window.testPassed = test1Pass && test2Pass && test3Pass;
                addResult(`Overall: ${window.testPassed ? '✅ ALL TESTS PASSED' : '❌ SOME TESTS FAILED'}`);
            } catch (error) {
                addResult(`ERROR: ${error.message}`);
                addResult(`Stack: ${error.stack}`);
                console.error(error);
                window.testPassed = false;
            }
        }
        
        runTests();
    </script>
</body>
</html>
