<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mountGlobally Simple Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="container"></div>
    <div id="results"></div>

    <script type="module">
        import '../ElementMountExtension.js';
        import { MountObserver } from '../index.js';

        const logs = [];
        const mountedElements = [];
        
        // Create a simple component
        class TestComponent extends HTMLElement {
            constructor() {
                super();
                logs.push('TestComponent constructor called');
                const shadow = this.attachShadow({ mode: 'open' });
                shadow.innerHTML = '<span class="target">Target in shadow</span>';
                logs.push('TestComponent shadow created with target');
            }
        }
        customElements.define('test-component', TestComponent);
        
        const container = document.getElementById('container');
        
        // Mount globally with logging
        await container.mountGlobally({
            matching: '.target',
            do: (el) => {
                logs.push(`Mounted element: ${el.className} in ${el.getRootNode().constructor.name}`);
                mountedElements.push(el);
                el.setAttribute('data-mounted', 'true');
            }
        });
        
        logs.push('mountGlobally completed, adding component...');
        
        // Add component after mountGlobally
        const component = document.createElement('test-component');
        container.appendChild(component);
        
        logs.push('Component added to DOM');
        
        // Wait a bit
        await new Promise(resolve => setTimeout(resolve, 100));
        
        logs.push('After 100ms wait');
        
        // Check results
        const targetInShadow = component.shadowRoot.querySelector('.target');
        const wasMounted = targetInShadow?.getAttribute('data-mounted') === 'true';
        
        logs.push(`Target found: ${!!targetInShadow}`);
        logs.push(`Target mounted: ${wasMounted}`);
        logs.push(`Total mounted elements: ${mountedElements.length}`);
        
        // Display results
        const results = document.getElementById('results');
        results.innerHTML = `
            <h3>Test Result: ${wasMounted ? 'PASS' : 'FAIL'}</h3>
            <h4>Logs:</h4>
            <pre>${logs.join('\n')}</pre>
            <h4>Mounted Elements:</h4>
            <pre>${mountedElements.map(el => `${el.tagName}.${el.className}`).join('\n')}</pre>
        `;
        
        results.setAttribute('data-result', wasMounted ? 'pass' : 'fail');
        
        window.testsReady = true;
    </script>
</body>
</html>
