<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhancement Registry Integration Tests</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="test-container"></div>

    <script type="module">
        import { MountObserver } from '../MountObserver.js';

        // Mock enhancement registry for testing
        class MockRegistry {
            constructor() {
                this.items = [];
            }
            
            push(item) {
                this.items.push(item);
            }
            
            getItems() {
                return this.items;
            }
            
            findByEnhKey(enhKey) {
                return this.items.find(item => item.enhKey === enhKey);
            }
            
            findBySymbol(symbol) {
                return this.items.find(item => item.symlinks && symbol in item.symlinks);
            }
        }

        // Add mock registry to test container
        const container = document.getElementById('test-container');
        container.customElementRegistry = {
            enhancementRegistry: new MockRegistry()
        };

        window.testResults = {
            registry: container.customElementRegistry.enhancementRegistry,
            observers: []
        };

        console.log('Test setup complete');
    </script>
</body>
</html>
