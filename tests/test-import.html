<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MountObserver v2 - Import Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>MountObserver v2 - Import Test</h1>
    
    <div id="container">
        <fancy-button id="btn1">Click Me</fancy-button>
    </div>

    <button id="addBtn" type="button">Add fancy-button</button>

    <div id="log"></div>

    <script type="module">
        import { MountObserver } from '../MountObserver.js';

        const log = document.getElementById('log');
        function addLog(message) {
            const p = document.createElement('p');
            p.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            log.appendChild(p);
        }

        // Create observer with import
        const observer = new MountObserver({
            whereElementMatches: 'fancy-button',
            import: '/tests/fancy-button.js',
            do: (element, { modules, observer }) => {
                const { localName } = element;
                addLog(`Do callback: Defining ${localName}`);
                
                if (!customElements.get(localName)) {
                    customElements.define(localName, modules[0].FancyButton);
                    addLog(`Custom element ${localName} defined`);
                }
            }
        });

        // Listen to events
        observer.addEventListener('load', (e) => {
            addLog(`Load event: ${e.modules.length} module(s) loaded`);
        });

        observer.addEventListener('mount', (e) => {
            addLog(`Mount event: ${e.matchingElement.id || 'unnamed'}`);
        });

        // Start observing
        observer.observe(document.body);
        addLog('Observer started');

        // Add button handler
        let counter = 2;
        document.getElementById('addBtn').addEventListener('click', () => {
            const el = document.createElement('fancy-button');
            el.id = `btn${counter++}`;
            el.textContent = `Button ${counter - 1}`;
            document.getElementById('container').appendChild(el);
            addLog(`Added element: ${el.id}`);
        });
    </script>
</body>
</html>
