<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class MyTest{
            myList = [1, 2, 3];
        }

        MyTest.prototype[Symbol.iterator] = function() {
            var index = -1;
            var data  = this.myList;

            return {
                next: function() {
                    return { 
                        value: data === undefined ? undefined : data[++index], 
                        done: data ===  undefined || !(index in data),
                        
                    }
                },
                
            };
        };

        const myTest = new MyTest();
        for(const obj of myTest){
            console.log(obj);
        }
        console.log(myTest.length);
    </script>
</body>
</html>
