<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhereAttr Debug</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <h1>WhereAttr Debug Test</h1>
    
    <input id="test1" my-greetings="hello">
    <input id="test2" data-my-greetings="hello">
    
    <script type="module">
        import { MountObserver } from '../MountObserver.js';
        import { matchesWhereAttr } from '../whereAttr.js';

        // Test the matching function directly
        const input1 = document.getElementById('test1');
        const input2 = document.getElementById('test2');
        
        const whereAttr = {
            hasBuiltInRootIn: ['', 'data'],
            hasBase: 'my-greetings'
        };
        
        console.log('Testing matchesWhereAttr directly:');
        console.log('input1 matches:', matchesWhereAttr(input1, whereAttr));
        console.log('input2 matches:', matchesWhereAttr(input2, whereAttr));
        
        // Test with MountObserver
        const mo = new MountObserver({
            withMatching: 'input',
            whereAttr: whereAttr
        });
        
        mo.addEventListener('mount', (e) => {
            console.log('Mounted:', e.mountedElement.id);
        });
        
        console.log('Starting observation...');
        mo.observe(document.body);
    </script>
</body>
</html>
