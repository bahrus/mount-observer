<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declarative Partial Updates</title>
</head>
<body>


    <div>Section 1</div>
    <section>
        <?start name="gallery">Loading...<?end>
    </section>

    <div>Section 2</div>
    <section>
        <?start name="gallery">Loading...<?end>
    </section>

    <template for="gallery">
        Actual gallery content 1
    </template>

    <template for="gallery">
        Actual gallery content 2
    </template>

</body>
</html>
